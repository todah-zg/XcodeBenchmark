# XcodeBenchmark on Codemagic: M4 vs M4 Pro
#
# Two kinds of workflows, kept apart on purpose so the extras never touch the timed build:
#   xcodebenchmark-*   the timed compile. Only cheap wall-clock timestamps and a 10 s
#                      background sampler (memory pressure, swap, thermal state).
#   hwbaseline-*       disk + memory-bandwidth microbenchmarks. Run these separately,
#                      never during a benchmark build.
#
# Machine selection: the M4 workflows pin instance_type: mac_mini_m4. The M4 Pro workflows
# have NO instance_type on purpose: they run on the team's default machine, which is switched
# manually in team settings before running them. Always confirm the chip in the
# "Environment info" step of each build log.
#
# Run each xcodebenchmark workflow 5x per machine, one build at a time, and compare the
# median and the minimum. Same Xcode on every machine is what makes the comparison valid.

definitions:
  env: &env
    xcode: 26.6   # adjust to the exact 26.6.x string the image reports if this does not resolve

  info_step: &info_step
    name: Environment info
    script: |
      sw_vers
      xcodebuild -version
      sysctl -n machdep.cpu.brand_string
      sysctl -n hw.ncpu hw.perflevel0.logicalcpu hw.perflevel1.logicalcpu hw.memsize 2>/dev/null
      system_profiler SPHardwareDataType | grep -E "Model Name|Model Identifier|Chip|Total Number of Cores|Memory"
      df -h / | tail -1

  # Starts a very low-rate sampler (every 10 s). Note: inside the virtual machines thermal
  # data is not exposed (pmset prints nothing), so only swap/memory pressure are informative.
  sampler_start: &sampler_start
    name: Start light sampler
    script: |
      mkdir -p "$CM_BUILD_DIR/bench_out"
      (
        while true; do
          {
            echo "=== $(date +%T)"
            pmset -g therm 2>/dev/null | grep -iE "speed_limit|cpu_scheduler|thermal" 
            sysctl vm.swapusage
            memory_pressure -Q 2>/dev/null | grep -i "free percentage"
          } >> "$CM_BUILD_DIR/bench_out/samples.log"
          sleep 10
        done
      ) &
      echo $! > "$CM_BUILD_DIR/bench_out/sampler.pid"

  benchmark_step: &benchmark_step
    name: Run XcodeBenchmark (timed)
    script: |
      START=$(date +%s)
      sh benchmark.sh 2>&1 | tee "$CM_BUILD_DIR/bench_out/benchmark.log"
      STATUS=${PIPESTATUS[0]}
      END=$(date +%s)
      echo "WALL_CLOCK_SECONDS=$((END-START))" | tee "$CM_BUILD_DIR/bench_out/summary.txt"
      exit $STATUS

  sampler_stop: &sampler_stop
    name: Stop sampler and summarize
    ignore_failure: true
    script: |
      kill "$(cat "$CM_BUILD_DIR/bench_out/sampler.pid")" 2>/dev/null || true
      echo "--- summary ---"
      cat "$CM_BUILD_DIR/bench_out/summary.txt"
      echo "--- throttling / swap samples (look for speed_limit < 100 or swap growth) ---"
      grep -hE "speed_limit|swapusage" "$CM_BUILD_DIR/bench_out/samples.log" | sort | uniq -c | sort -rn | head

  # Disk: sequential write/read with dd, then random 4K read/write mix with fio.
  disk_step: &disk_step
    name: Disk speed
    script: |
      F="$HOME/disk_test.bin"
      echo "Sequential write 4 GiB"
      dd if=/dev/zero of="$F" bs=1m count=4096 2>&1 | tail -1
      sync
      sudo purge 2>/dev/null || echo "purge unavailable: read result may be cache-inflated"
      echo "Sequential read 4 GiB"
      dd if="$F" of=/dev/null bs=1m 2>&1 | tail -1
      rm -f "$F"

      echo "Random 4K I/O (fio)"
      export HOMEBREW_NO_AUTO_UPDATE=1
      command -v fio >/dev/null || brew install fio || echo "fio install failed"
      if command -v fio >/dev/null; then
        fio --name=randrw --filename="$HOME/fio.bin" --size=4G --bs=4k --rw=randrw --rwmixread=70 \
            --iodepth=32 --direct=1 --ioengine=posixaio --runtime=30 --time_based --group_reporting \
          || echo "fio run failed (not fatal)"
        rm -f "$HOME/fio.bin"
      else
        echo "fio not available: skipping random I/O"
      fi

  # Memory bandwidth: multithreaded triad kernel compiled inline (no downloads).
  # One untimed warm-up trial, then 5 timed trials; the best one is reported.
  membw_step: &membw_step
    name: Memory bandwidth
    script: |
      cat > /tmp/membw.c <<'EOF'
      #include <stdio.h>
      #include <stdlib.h>
      #include <pthread.h>
      #include <time.h>
      #include <unistd.h>
      #define N (16*1024*1024)   /* doubles per array per thread (128 MiB), far above any cache */
      #define INNER 5
      #define TRIALS 6           /* trial 0 is the warm-up */
      static int nt;
      static pthread_mutex_t m = PTHREAD_MUTEX_INITIALIZER;
      static pthread_cond_t cv = PTHREAD_COND_INITIALIZER;
      static int arrived = 0, gen = 0;
      static double best = 0, t0;
      static void barrier(void) {
        pthread_mutex_lock(&m);
        int g = gen;
        if (++arrived == nt) { arrived = 0; gen++; pthread_cond_broadcast(&cv); }
        else while (g == gen) pthread_cond_wait(&cv, &m);
        pthread_mutex_unlock(&m);
      }
      static double now(void) {
        struct timespec t; clock_gettime(CLOCK_MONOTONIC, &t);
        return t.tv_sec + t.tv_nsec / 1e9;
      }
      static void *work(void *arg) {
        long id = (long)arg;
        double *a = malloc(N * 8), *b = malloc(N * 8), *c = malloc(N * 8);
        for (long i = 0; i < N; i++) { a[i] = 0; b[i] = 1; c[i] = 2; }
        for (int t = 0; t < TRIALS; t++) {
          barrier();
          if (id == 0) t0 = now();
          for (int r = 0; r < INNER; r++) {
            double s = 3.0 + r;
            for (long i = 0; i < N; i++) a[i] = b[i] + s * c[i];
          }
          barrier();
          if (id == 0) {
            double sec = now() - t0;
            double gbs = (double)nt * INNER * N * 24.0 / sec / 1e9;
            if (t == 0) printf("warm-up : %.1f GB/s (ignored)\n", gbs);
            else { printf("trial %d : %.1f GB/s\n", t, gbs); if (gbs > best) best = gbs; }
          }
        }
        volatile double sink = a[N / 2]; (void)sink;
        return 0;
      }
      int main(void) {
        nt = (int)sysconf(_SC_NPROCESSORS_ONLN);
        pthread_t th[64];
        if (nt > 64) nt = 64;
        for (long i = 0; i < nt; i++) pthread_create(&th[i], 0, work, (void *)i);
        for (int i = 0; i < nt; i++) pthread_join(th[i], 0);
        printf("threads=%d BEST triad bandwidth ~ %.1f GB/s\n", nt, best);
        return 0;
      }
      EOF
      clang -O3 -o /tmp/membw /tmp/membw.c
      /tmp/membw

workflows:
  # ---- Timed compile benchmark -------------------------------------------
  xcodebenchmark-m4:
    name: XcodeBenchmark M4
    instance_type: mac_mini_m4
    max_build_duration: 30
    environment: *env
    scripts:
      - *info_step
      - *sampler_start
      - *benchmark_step
      - *sampler_stop
    artifacts:
      - bench_out/*

  # No instance_type: runs on the team's default machine (switch the default to M4 Pro first).
  xcodebenchmark-m4-pro:
    name: XcodeBenchmark M4 Pro
    max_build_duration: 30
    environment: *env
    scripts:
      - *info_step
      - *sampler_start
      - *benchmark_step
      - *sampler_stop
    artifacts:
      - bench_out/*

  # ---- Hardware microbenchmarks (run separately from the compile benchmark) ----
  hwbaseline-m4:
    name: HW baseline M4
    instance_type: mac_mini_m4
    max_build_duration: 20
    environment: *env
    scripts:
      - *info_step
      - *disk_step
      - *membw_step

  # No instance_type: runs on the team's default machine (switch the default to M4 Pro first).
  hwbaseline-m4-pro:
    name: HW baseline M4 Pro
    max_build_duration: 20
    environment: *env
    scripts:
      - *info_step
      - *disk_step
      - *membw_step
